<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkV2 - Memory</title>
  <base href="/">
    <style>
        #app-loader{position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:#09090b;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fafafa;transition:opacity .4s ease,visibility .4s ease}
        #app-loader.fade-out{opacity:0;visibility:hidden;pointer-events:none}
        .loader-icon-box{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 0 25px rgba(99,102,241,.45)}
        .loader-app-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
        .loader-app-sub{font-size:.85rem;color:#a1a1aa;margin-bottom:22px}
        .loader-bar-bg{width:160px;height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;position:relative}
        .loader-bar-fill{width:45%;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:99px;position:absolute;animation:loader-slide 1.4s infinite ease-in-out}
        @keyframes loader-slide{0%{left:-45%}100%{left:100%}}
    </style>
    <script>
        (function(){function r(){var l=document.getElementById('app-loader');if(l&&!l.classList.contains('fade-out')){l.classList.add('fade-out');setTimeout(function(){if(l&&l.parentNode)l.parentNode.removeChild(l);},450);}}window.addEventListener('load',function(){setTimeout(r,250);});setTimeout(r,2500);})();
    </script>
    <link rel="stylesheet" href="/css/style.css?v=3" />
    <link rel="stylesheet" href="/css/memory.css?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.ico" />
</head>

<body data-theme="dark">
  <div id="app-loader">
    <div class="loader-icon-box"><svg width="26" height="26" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path d="M150 10 L60 140 H120 L100 246 L196 116 H136 Z" fill="white" /></svg></div>
    <div class="loader-app-title">SparkV2 AI</div>
    <div class="loader-app-sub">Loading memory...</div>
    <div class="loader-bar-bg"><div class="loader-bar-fill"></div></div>
  </div>
  <div class="app-container">
    <div id="mobile-overlay" class="overlay hidden"></div>

    <aside id="sidebar" class="sidebar collapsed">
      <div id="sidebar-header" class="sidebar-header" title="Click to Expand/Collapse">
        <div class="logo-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
          <span class="sidebar-title fade-in-text">SparkV2</span>
        </div>
        <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Toggle sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toggle-icon">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>

      <div class="new-chat-wrapper">
        <button class="new-chat-btn"
          onclick="localStorage.setItem('spark_chat_history', '[]'); window.location.href='index.html';"
          title="New Chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
          <span class="fade-in-text">New Chat</span>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item" title="Chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="nav-label fade-in-text">Chats</span>
        </a>
        <a href="memory.html" class="nav-item active" title="Memory">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"></path>
          </svg>
          <span class="nav-label fade-in-text">Memory</span>
        </a>
        <a href="settings.html" class="nav-item" title="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
            </path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span class="nav-label fade-in-text">Settings</span>
        </a>
        <a href="profile.html" class="nav-item" title="Profile">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Head -->
            <path d="M20 21c0-3.3-3.6-6-8-6s-8 2.7-8 6" />
            <!-- Face -->
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="nav-label fade-in-text">Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">V2</div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" x2="20" y1="12" y2="12"></line>
              <line x1="4" x2="20" y1="6" y2="6"></line>
              <line x1="4" x2="20" y1="18" y2="18"></line>
            </svg>
          </button>
          <div class="header-branding">
            <h1>Memory Management</h1>
          </div>
        </div>
      </header>

      <div class="memory-container">
        <div class="memory-tools">
          <div class="search-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="text" id="memory-search" placeholder="Search memories..." class="search-input" />
          </div>
          <button id="clear-memory-btn" class="btn-danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            Clear All
          </button>
        </div>

        <div id="memory-list" class="memory-list"></div>
      </div>
    </main>

    <nav class="mobile-bottom-nav">
      <a href="index.html" class="mobile-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Chat</span>
      </a>
      <a href="memory.html" class="mobile-nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
          <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"></path>
        </svg>
        <span>Memory</span>
      </a>
      <a href="settings.html" class="mobile-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
          </path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>Settings</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Account</span>
      </a>
    </nav>
  </div>

  <script src="js/script.js" defer></script>
</body>

</html>
